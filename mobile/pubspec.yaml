name: ilevora_mobile
description: Ilevora — Farm Operating System for field supervisors
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local database (offline-first)
  sqflite: ^2.3.2
  # sqflite has no web support of its own; this runs the same database in the browser (Chrome/Edge).
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0

  # Connectivity & sync
  connectivity_plus: ^7.3.1
  http: ^1.2.0

  # Local storage (simple key-value)
  shared_preferences: ^2.2.2

  # Secure storage for auth token
  flutter_secure_storage: ^10.3.1

  # Date handling
  intl: ^0.19.0

  # UUID for offline record IDs
  uuid: ^4.3.3

  # GPS / Location
  geolocator: ^11.0.0

  # UI extras
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icon/icon.png
  adaptive_icon_background: "#0F7A3A"
  adaptive_icon_foreground: tool/icon/icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
