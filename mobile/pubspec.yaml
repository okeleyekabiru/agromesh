name: agromesh_mobile
description: AgroMesh — Farm Operating System for field supervisors
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local database (offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Connectivity & sync
  connectivity_plus: ^5.0.2
  http: ^1.2.0

  # Local storage (simple key-value)
  shared_preferences: ^2.2.2

  # Secure storage for auth token
  flutter_secure_storage: ^9.2.2

  # Date handling
  intl: ^0.19.0

  # UUID for offline record IDs
  uuid: ^4.3.3

  # GPS / Location
  geolocator: ^11.0.0

  # UI extras
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
