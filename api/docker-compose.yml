version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: agromesh_db
    environment:
      POSTGRES_DB: agromesh
      POSTGRES_USER: agromesh
      POSTGRES_PASSWORD: agromesh_dev
    ports:
      - "5433:5432"
    volumes:
      - agromesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agromesh -d agromesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agromesh_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agromesh_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=agromesh;Username=agromesh;Password=agromesh_dev"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_FARM_ID: farm_001
    container_name: agromesh_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  agromesh_pgdata:
