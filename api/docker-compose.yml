version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ilevora_db
    environment:
      POSTGRES_DB: ilevora
      POSTGRES_USER: ilevora
      POSTGRES_PASSWORD: ilevora_dev
    ports:
      - "5433:5432"
    volumes:
      - ilevora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilevora -d ilevora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ilevora_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilevora_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ilevora;Username=ilevora;Password=ilevora_dev"
      ConnectionStrings__Redis: "redis:6379"
      App__WebBaseUrl: "http://localhost:5173"
      Resend__Enabled: "${RESEND_ENABLED:-false}"
      Resend__ApiKey: "${RESEND_API_KEY:-}"
      Resend__FromAddress: "${RESEND_FROM:-Ilevora <onboarding@resend.dev>}"
    volumes:
      # Local keys are mounted in, not baked into the image (see .dockerignore).
      - ./Ilevora.API/appsettings.Development.json:/app/appsettings.Development.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_FARM_ID: farm_001
    container_name: ilevora_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  ilevora_pgdata:
